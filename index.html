<!DOCTYPE html>
<html lang="en-us">
<head>
 
  <meta charset="utf-8">
  <title>Unity WebGL Player | Hollow Knight</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
    }
    #loading-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font: 24px Arial;
    }
    #unity-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #unity-mobile-warning {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      border-radius: 8px;
      font: 14px Arial;
    }
    #fps-graph {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 200px;
      height: 70px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 6px;
      padding: 10px;
      z-index: 9999;
      transition: 0.3s;
    }
    #fps-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .savebtn {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 10px 18px;
      cursor: pointer;
      background: rgba(50, 50, 50, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font: 14px Arial;
      z-index: 9999;
      transition: 0.3s;
    }
    .savebtn:hover {
      background: rgba(70, 70, 70, 0.95);
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading-text">Git Gud</div>
  <div id="unity-mobile-warning">WebGL not supported on mobile</div>
  <canvas id="unity-canvas"></canvas>
  <div id="fps-graph" style="display: none;">
    <canvas id="fps-canvas"></canvas>
  </div>

  <script>
    
    canvas = document.getElementById("unity-canvas");
    loadingText = document.getElementById("loading-text");
    mobileWarning = document.getElementById("unity-mobile-warning");
    // Mobile Viewport Check
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width,height=device-height,initial-scale=1,user-scalable=no,shrink-to-fit=yes';
      document.head.appendChild(meta);

      mobileWarning.style.display = "block";
      setTimeout(() => mobileWarning.style.display = "none", 5000);
    }

    
    // Main Unity WebGL initialization using combined files
    (async () => {
      const loaderScript = document.createElement("script");
      loaderScript.src = "Build/hktruffled.loader.js";

      loaderScript.onload = () => {
        createUnityInstance(canvas, {
          dataUrl: "Build/hktruffled.data",
          frameworkUrl: "Build/hktruffled.framework.js",
          codeUrl: "Build/hktruffled.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Team Cherry",
          productName: "Hollow Knight",
          productVersion: "1.0"
        }).then((instance) => {
          unityInstance = instance;
          window.unityInstance = instance;
          window.Module = instance.Module;
          window.FS = instance.Module && instance.Module.FS;
          loadingText.remove();

        }).catch(alert);
      };

      document.body.appendChild(loaderScript);
    })();

  </script>
</body>
</html>
